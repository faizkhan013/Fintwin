services:
  db:
    image: postgres:18
    container_name: cashflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cashflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cashflow_postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: cashflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: cashflow-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: cashflow-celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    command: celery -A config worker -l info

volumes:
  cashflow_postgres_data:
